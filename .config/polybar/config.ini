;==========================================================
;
;   POLYBAR CONFIGURATION (i3 Pretty Bar)
;   Theme: Catppuccin Mocha
;   Font: JetBrainsMono Nerd Font
;
;==========================================================

[colors]
; Catppuccin Mocha Palette
base = #1e1e2e
mantle = #181825
crust = #11111b
surface0 = #313244
surface1 = #45475a
surface2 = #585b70
overlay0 = #6c7086
overlay1 = #7f849c
subtext0 = #a6adc8
subtext1 = #bac2de
text = #cdd6f4

lavender = #b4befe
blue = #89b4fa
sapphire = #74c7ec
sky = #89dceb
teal = #94e2d5
green = #a6e3a1
yellow = #f9e2af
peach = #fab387
maroon = #eba0ac
red = #f38ba8
mauve = #cba6f7
pink = #f5c2e7
flamingo = #f2cdcd
rosewater = #f5e0dc

transparent = #00000000

[bar/main]
width = 100%
height = 21pt
radius = 6

; Floating pill margin matching i3 window gaps
border-size = 3pt
border-color = ${colors.transparent}

background = ${colors.base}
foreground = ${colors.text}

line-size = 2pt

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = JetBrainsMono Nerd Font Propo:style=Bold:pixelsize=10;2
font-1 = JetBrainsMono Nerd Font Propo:style=Regular:pixelsize=10;2
font-2 = JetBrainsMono Nerd Font Propo:style=Medium:pixelsize=11;2

modules-left = i3
modules-center = date
modules-right = filesystem pulseaudio battery tray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
; wm-restack = i3
override-redirect = false

;==========================================================
;   MODULES
;==========================================================

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false

format = <label-state> <label-mode>

; Mode (e.g. resize)
label-mode = %mode%
label-mode-padding = 2
label-mode-background = ${colors.peach}
label-mode-foreground = ${colors.crust}

; Focused workspace
label-focused = %name%
label-focused-foreground = ${colors.crust}
label-focused-background = ${colors.mauve}
label-focused-padding = 2
label-focused-margin = 1

; Unfocused workspace
label-unfocused = %name%
label-unfocused-foreground = ${colors.subtext0}
label-unfocused-background = ${colors.surface0}
label-unfocused-padding = 2
label-unfocused-margin = 1

; Visible workspace (active on inactive monitor)
label-visible = %name%
label-visible-foreground = ${colors.text}
label-visible-background = ${colors.surface1}
label-visible-padding = 2
label-visible-margin = 1

; Urgent workspace
label-urgent = %name%
label-urgent-foreground = ${colors.crust}
label-urgent-background = ${colors.red}
label-urgent-padding = 2
label-urgent-margin = 1


[module/date]
type = internal/date
interval = 1

time = %H:%M
time-alt = %H:%M:%S
date = %a, %b %d
date-alt = %A, %B %d, %Y

format = <label>
format-background = ${colors.surface0}
format-padding = 2
label = "%{A1:gsimplecal:}%{F#cba6f7}󰥔 %{F-}%time%   %{F#6c7086}│%{F-}   %{F#89b4fa}󰃭 %{F-}%date%%{A}"
label-foreground = ${colors.text}


[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
fixed-values = true
warn-percentage = 85

format-mounted = <label-mounted>
format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.sapphire}
format-mounted-background = ${colors.surface0}
format-mounted-padding = 2
label-mounted = %percentage_used%%
label-mounted-foreground = ${colors.text}

format-warn = <label-warn>
format-warn-prefix = "󰋊 "
format-warn-prefix-foreground = ${colors.red}
format-warn-background = ${colors.surface0}
format-warn-padding = 2
label-warn = %percentage_used%%
label-warn-foreground = ${colors.red}


[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5

format-volume = <ramp-volume> <label-volume>
format-volume-background = ${colors.surface0}
format-volume-padding = 2

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.teal}

label-volume = %percentage%%
label-volume-foreground = ${colors.text}

format-muted = <label-muted>
format-muted-background = ${colors.surface0}
format-muted-padding = 2
label-muted = "󰝟 muted"
label-muted-foreground = ${colors.overlay0}

click-right = pavucontrol


[module/battery]
type = internal/battery
full-at = 98
low-at = 20
battery = BAT0
adapter = AC
poll-interval = 5
time-format = %H:%M

; Charging
format-charging = <animation-charging> <label-charging>
format-charging-background = ${colors.surface0}
format-charging-padding = 2
label-charging = %percentage%%
label-charging-foreground = ${colors.text}
animation-charging-0 = 󰢜
animation-charging-1 = 󰂇
animation-charging-2 = 󰂈
animation-charging-3 = 󰂉
animation-charging-4 = 󰂊
animation-charging-5 = 󰂅
animation-charging-foreground = ${colors.green}
animation-charging-framerate = 750

; Discharging
format-discharging = <ramp-capacity> <label-discharging>
format-discharging-background = ${colors.surface0}
format-discharging-padding = 2
label-discharging = %percentage%%
label-discharging-foreground = ${colors.text}
ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂
ramp-capacity-10 = 󰁹
ramp-capacity-foreground = ${colors.peach}

; Full
format-full = <label-full>
format-full-background = ${colors.surface0}
format-full-padding = 2
label-full = "󰁹 100%"
label-full-foreground = ${colors.green}

; Low
format-low = <label-low>
format-low-background = ${colors.surface0}
format-low-padding = 2
label-low = "󰂃 %percentage%%"
label-low-foreground = ${colors.red}


[module/tray]
type = internal/tray
format-margin = 4px
format-background = ${colors.surface0}
format-padding = 2
tray-background = ${colors.surface0}
tray-spacing = 8px
tray-size = 65%

;==========================================================
;   SETTINGS
;==========================================================

[settings]
screenchange-reload = true
pseudo-transparency = true
